[pytest]
; web3 (a Phase 2 dependency, see SHIPMENT_ESCROW.md) registers its own
; pytest11 entry point (`pytest_ethereum`), which pytest auto-loads on
; EVERY invocation regardless of which tests are selected. On an
; environment where web3's full dependency tree isn't completely
; installed (e.g. Python 3.14 on Windows, where several of its native
; extensions lack prebuilt wheels and there's no C compiler to build them
; from source — see CLAUDE.md's "Known gotchas"), importing that plugin
; crashes pytest before it can even collect tests, unrelated to anything
; in this repo's own test suite. Disabling it here is safe: nothing in
; tests/ uses it.
addopts = -p no:pytest_ethereum
