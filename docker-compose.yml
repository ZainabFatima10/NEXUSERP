services:
  db:
    image: postgres:14
    container_name: nexus_db
    environment:
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_pass
      POSTGRES_DB: nexus_erp
    ports:
      - '5432:5432'
    volumes:
      - nexus_data:/var/lib/postgresql/data

  # Self-hosted n8n — runs the two vendor-email workflows described in
  # N8N_AUTOMATION_WIRING.md and stored under blockchain-module-main/n8n-workflows/:
  # the reorder Accept/Reject email (N8N_WEBHOOK_URL) and the post-accept
  # smart-contract confirmation email (N8N_CONTRACT_CONFIRMATION_WEBHOOK_URL).
  # FastAPI reaches both over the same :5678 webhook endpoint; n8n needs no
  # account of its own to receive either call.
  n8n:
    image: n8nio/n8n:latest
    container_name: nexus_n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Karachi
      N8N_RUNNERS_ENABLED: 'true'
    ports:
      - '5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  nexus_data:
  n8n_data:
